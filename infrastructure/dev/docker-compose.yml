# Local development and test database ONLY.
# Not used for staging or production; contains no production credential.
#
#   docker compose -f infrastructure/dev/docker-compose.yml up -d
#
name: euroteranga-dev

services:
  postgres:
    # PostgreSQL 16 keeps dev/CI on the same major version as the CI service;
    # the production version is decided with the deployment model (ADR-010).
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: euroteranga
      # Local placeholder, matches .env.example. Not a real credential.
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: euroteranga_dev
    ports:
      # Bound to loopback only: never reachable from the network.
      - '127.0.0.1:${EUROTERANGA_DEV_DB_PORT:-5432}:5432'
    volumes:
      - euroteranga-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U euroteranga -d euroteranga_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  euroteranga-dev-postgres:
