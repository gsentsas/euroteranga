name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repository. No job uses secrets, so pull
# requests from forks run with the same (empty) secret set.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CHECKPOINT_DISABLE: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # Public frontend configuration for CI builds (no secret involved).
  NEXT_PUBLIC_APP_ENV: ci
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_BOOKING_URL: http://localhost:3001
  NEXT_PUBLIC_CLIENT_URL: http://localhost:3002
  NEXT_PUBLIC_TRACKING_URL: http://localhost:3003

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build shared packages (type declarations)
        run: pnpm build:packages
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: euroteranga
          # Throwaway credential for the ephemeral CI container only.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: euroteranga_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euroteranga -d euroteranga_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://euroteranga:ci-only-password@localhost:5432/euroteranga_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Prisma validate
        run: pnpm db:validate
      - name: Migration deploy
        run: pnpm db:migrate
      - name: Migration deploy is idempotent
        run: pnpm db:migrate
      - name: Migration status is up to date
        run: pnpm db:migrate:status
      - name: Schema matches the migrated database (no drift)
        run: >-
          pnpm --filter @euroteranga/database exec prisma migrate diff
          --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Database connectivity (SELECT 1 through Prisma)
        run: echo 'SELECT 1;' | pnpm --filter @euroteranga/database exec prisma db execute --stdin

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: euroteranga
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: euroteranga_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euroteranga -d euroteranga_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://euroteranga:ci-only-password@localhost:5432/euroteranga_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build shared packages
        run: pnpm build:packages
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests (real PostgreSQL)
        run: pnpm test:integration

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build packages and all seven applications
        run: pnpm build
      - name: Verify every application produced a build
        run: |
          for app in web booking client tracking ops crew; do
            test -f "apps/$app/.next/BUILD_ID" || { echo "::error::apps/$app was not built"; exit 1; }
            echo "apps/$app: built"
          done
          test -f apps/api/dist/main.js || { echo "::error::apps/api was not built"; exit 1; }
          echo "apps/api: built"

  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: euroteranga
          # Throwaway credential for the ephemeral CI container only.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: euroteranga_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euroteranga -d euroteranga_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Core API started by Playwright (production build, loopback only).
      # NODE_ENV is deliberately not set here: NODE_ENV=production would make
      # `pnpm install` skip devDependencies needed to build and test.
      APP_ENV: ci
      DATABASE_URL: postgresql://euroteranga:ci-only-password@localhost:5432/euroteranga_ci
      API_HOST: 127.0.0.1
      API_PORT: '4000'
      # Public, unauthenticated browser apps that call the Core API directly.
      API_CORS_ORIGINS: http://localhost:3003
      # CUSTOMER: the client account and the booking app (PR-09).
      AUTH_CUSTOMER_ORIGINS: http://localhost:3002,http://localhost:3001
      AUTH_STAFF_ORIGINS: http://localhost:3004
      AUTH_CREW_ORIGINS: http://localhost:3005
      AUTH_MAIL_PROVIDER: disabled
      CLIENT_PUBLIC_URL: http://localhost:3002
      OPS_PUBLIC_URL: http://localhost:3004
      # PR-10: the local, test-only SANDBOX payment provider (no external call).
      PAYMENT_PROVIDER: SANDBOX
      # PR-11: private runner-local storage and a harmless deterministic scanner.
      # Both adapters are refused in staging/production by configuration.
      OBJECT_STORAGE_PROVIDER: LOCAL
      OBJECT_STORAGE_LOCAL_ROOT: /tmp/euroteranga-browser-documents
      MALWARE_SCANNER: TEST
      # MEDIA-1: public website images, in their own runner-local root.
      PUBLIC_MEDIA_STORAGE: LOCAL
      PUBLIC_MEDIA_LOCAL_ROOT: /tmp/euroteranga-browser-media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Generate ephemeral authentication and webhook keys (never stored)
        run: |
          {
            echo "AUTH_CSRF_KEY=$(openssl rand -base64 32)"
            echo "AUTH_HMAC_KEY=$(openssl rand -base64 32)"
            echo "AUTH_TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "PAYMENT_SANDBOX_WEBHOOK_SECRET=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Build packages and all applications
        run: pnpm build
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Install Chromium for Playwright
        run: pnpm --filter @euroteranga/browser-tests exec playwright install --with-deps chromium
      - name: Browser tests (frontends + Core API + PostgreSQL)
        run: pnpm test:e2e
      - name: Remove private document and public media test objects
        if: always()
        run: rm -rf /tmp/euroteranga-browser-documents /tmp/euroteranga-browser-media
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/browser/playwright-report/
          retention-days: 7

  pilot-acceptance:
    name: pilot-acceptance
    if: always()
    needs: [quality, database, test, build, browser, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all mandatory CI gates
        env:
          QUALITY: ${{ needs.quality.result }}
          DATABASE: ${{ needs.database.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          BROWSER: ${{ needs.browser.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          failed=0
          for gate in QUALITY DATABASE TEST BUILD BROWSER SECURITY; do
            result="${!gate}"
            if [ "$result" != "success" ]; then
              echo "::error::${gate,,} gate is $result"
              failed=1
            else
              echo "${gate,,}: success"
            fi
          done
          test "$failed" -eq 0
          echo "pilot acceptance CI gates: PASS"

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the full history, not only the last commit
      - name: Forbidden files and quality-gate bypass markers
        run: bash scripts/check-forbidden-files.sh
      - name: Hygiene check also works in a release tree without .git
        run: bash scripts/test-check-forbidden-files.sh
      - name: Validate Plesk deployment scripts and nginx fragments
        run: |
          for script in infrastructure/plesk/*.sh infrastructure/plesk/lib/*.sh; do
            bash -n "$script"
          done
          bash infrastructure/plesk/test-readiness.sh
          grep -Fq 'ROLLBACK_LINK="$APP_ROOT/.current.rollback.$$"' infrastructure/plesk/deploy-release.sh
          for app in web booking client tracking ops crew; do
            unit="infrastructure/plesk/systemd/euroteranga-${app}.service"
            if grep -Eq '^ExecStart=.*pnpm' "$unit"; then
              echo "::error file=$unit::Long-running frontend unit must not start through pnpm"
              exit 1
            fi
            grep -Eq "^WorkingDirectory=/var/www/vhosts/euroteranga.com/current/apps/${app}$" "$unit"
            grep -Eq '^ExecStart=/opt/plesk/node/24/bin/node node_modules/next/dist/bin/next start ' "$unit"
          done
          grep -Fq 'Persistent=true' infrastructure/plesk/systemd/euroteranga-postgres-backup.timer
          grep -Fq 'Persistent=true' infrastructure/plesk/systemd/euroteranga-postgres-restore-check.timer
          grep -Fq 'User=euroteranga.com_5p804yhows7' infrastructure/plesk/systemd/euroteranga-postgres-backup.service
          grep -Fq 'User=root' infrastructure/plesk/systemd/euroteranga-postgres-restore-check.service
          grep -Fq 'ReadWritePaths=/var/www/vhosts/euroteranga.com/backups' infrastructure/plesk/systemd/euroteranga-postgres-backup.service
          grep -Fq 'ReadWritePaths=/var/www/vhosts/euroteranga.com/backups' infrastructure/plesk/systemd/euroteranga-postgres-restore-check.service
          if grep -RFn '\\n' infrastructure/plesk/nginx --include='*.conf'; then
            echo "::error::Literal \\n sequence found in Plesk nginx fragment"
            exit 1
          fi
      - name: Validate private document scanner infrastructure
        run: |
          docker compose -f infrastructure/plesk/documents/docker-compose.yml config >/dev/null
          bash -n infrastructure/plesk/documents/install-clamav.sh
          python3 -m py_compile infrastructure/plesk/documents/verify-clamav-instream.py
          grep -Fq "127.0.0.1:3310:3310" infrastructure/plesk/documents/docker-compose.yml
          grep -Eq 'clamav/clamav@sha256:[0-9a-f]{64}' infrastructure/plesk/documents/docker-compose.yml
      - name: Secret detection (gitleaks, checksum-verified binary)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --config .gitleaks.toml .
      - uses: ./.github/actions/setup-workspace
      - name: Dependency audit (fails on high or critical)
        # Documented exceptions: docs/security/dependency-audit.md
        run: pnpm audit:dependencies