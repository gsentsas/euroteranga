name: CARGO-1 temporary format

on:
  push:
    branches:
      - feat/cargo-1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Format CARGO-1 files
        run: |
          pnpm exec prettier --write \
            apps/api/src/cargo/admin-cargo.controller.ts \
            apps/api/src/cargo/cargo-rules.ts \
            apps/api/src/cargo/cargo-views.ts \
            apps/api/src/cargo/cargo.dto.ts \
            apps/api/src/cargo/cargo.service.ts \
            apps/api/src/trips/trip.service.ts \
            apps/api/test/integration/cargo/cargo.int.spec.ts \
            apps/api/test/support/cargo-helpers.ts \
            apps/api/test/unit/cargo/cargo-rules.spec.ts \
            apps/ops/components/cargo/cargo-admin.tsx \
            docs/domain/cargo.md \
            packages/auth-client/src/auth-client.ts \
            apps/api/test/integration/authorization/rbac.int.spec.ts \
            tests/browser/specs/cargo.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/cargo/admin-cargo.controller.ts \
            apps/api/src/cargo/cargo-rules.ts \
            apps/api/src/cargo/cargo-views.ts \
            apps/api/src/cargo/cargo.dto.ts \
            apps/api/src/cargo/cargo.service.ts \
            apps/api/src/trips/trip.service.ts \
            apps/api/test/integration/cargo/cargo.int.spec.ts \
            apps/api/test/support/cargo-helpers.ts \
            apps/api/test/unit/cargo/cargo-rules.spec.ts \
            apps/ops/components/cargo/cargo-admin.tsx \
            docs/domain/cargo.md \
            packages/auth-client/src/auth-client.ts \
            apps/api/test/integration/authorization/rbac.int.spec.ts \
            tests/browser/specs/cargo.spec.ts
          git commit -m "CARGO-1: format changed files"
          git push origin HEAD:feat/cargo-1
