name: Temporary Prettier Fix

on:
  push:
    branches:
      - feat/ops-ui-2-seat-maps

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message != 'chore: apply prettier formatting' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ops-ui-2-seat-maps
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write apps/ops/components/seat-maps/seat-map-preview.tsx apps/ops/components/seat-maps/seat-maps-admin.tsx tests/browser/specs/seat-maps.spec.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ops/components/seat-maps/seat-map-preview.tsx apps/ops/components/seat-maps/seat-maps-admin.tsx tests/browser/specs/seat-maps.spec.ts
          git commit -m "chore: apply prettier formatting"
          git push origin HEAD:feat/ops-ui-2-seat-maps
