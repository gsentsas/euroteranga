# Secret detection configuration (CI "security" job).
# Default gitleaks rules apply unchanged. The allow-list only excludes local
# build output (gitignored, never committed), which contains per-build preview
# keys generated by Next.js and would otherwise be reported by `gitleaks dir`.
[extend]
useDefault = true

[allowlist]
description = "Local build artifacts (gitignored)"
paths = [
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
  '''(^|/)node_modules/''',
]
