# Secret detection configuration (CI "security" job).
# Default gitleaks rules apply unchanged.
[extend]
useDefault = true

[[allowlists]]
description = "Local build artifacts and documented development-only example keys"
# Local build output (gitignored, never committed) contains per-build preview
# keys generated by Next.js, reported by `gitleaks dir`.
paths = [
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
  '''(^|/)node_modules/''',
]
# The example keys published in .env.example. They decode to
# "dev-only-...-not-a-real-secret", are refused at startup in staging and
# production (EXAMPLE_AUTH_SECRETS in packages/config) and kept in sync by a
# unit test. Only these exact values are allowed: any other key is reported.
regexTarget = "secret"
regexes = [
  '''^ZGV2LW9ubHktY3NyZi1rZXktbm90LWEtcmVhbC1zZWNyZXQ=$''',
  '''^ZGV2LW9ubHktaG1hYy1rZXktbm90LWEtcmVhbC1zZWNyZXQ=$''',
  '''^ZGV2LW9ubHktdG90cC1rZXktbm90LWEtc2VjcmV0ISE=$''',
  # PR-10: SANDBOX webhook example key ("dev-only-sandbox-webhook-not-a-secret");
  # SANDBOX is refused in staging and production (packages/config).
  '''^ZGV2LW9ubHktc2FuZGJveC13ZWJob29rLW5vdC1hLXNlY3JldA==$''',
]

# PR-14: ETQ-* values below are PII-free boarding credential references used
# only as deterministic test fixtures. They are not API keys or provider
# credentials. Keep the exception narrow: one Gitleaks rule, two unit-test
# files, and the exact credential-reference format. With condition = "AND",
# both the path and extracted secret must match.
[[allowlists]]
description = "PR-14 PII-free boarding credential test fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^apps/api/test/unit/check-in/check-in-rules\.spec\.ts$''',
  '''^apps/api/test/unit/check-in/check-in-views\.spec\.ts$''',
]
regexes = [
  '''^ETQ-[0-9A-Z]{16}$''',
]
